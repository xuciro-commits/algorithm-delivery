          tar -C "$RUNNER_TEMP/warehouse-package" -czf "$GITHUB_WORKSPACE/release-assets/warehouse-$ASSET.tar.gz" warehouse

      - name: 上传平台产物
        uses: actions/upload-artifact@v6
