  build-agv-cli:
    name: AGV Native CLI · ${{ matrix.asset }}
    needs: [plan, aps-quality, mapf-quality, agv-quality, warehouse-quality]
    # 只构建本次选中的引擎（engines=all 时全部构建；部分构建不发布 Release）。
    # `!cancelled() && !failure()`：部分引擎没被选中时它们的质量门是 skipped，
