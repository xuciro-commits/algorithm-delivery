      - name: 上传 WASM 产物
        uses: actions/upload-artifact@v6
        with:
          name: release-warehouse-wasm32-unknown-unknown
          path: release-assets/warehouse-engine-wasm32-unknown-unknown.wasm
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布 GitHub Release
    needs: [plan, build-cli, build-wasm, build-mapf-cli, build-mapf-wasm, build-agv-cli, build-agv-wasm, build-warehouse-cli, build-warehouse-wasm]
    # 只有"全量构建成功"才发布：engines 选了单个引擎时 full=false（产物不完整，宁可不发），
    # dry_run=yes 时只验证构建链路。
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.full == 'true' && inputs.dry_run != 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 下载所有成功构建的产物
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: 生成版本信息与 SHA-256SUMS
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          printf 'Algorithm Delivery %s\n' "$VERSION" > release-assets/VERSION.txt
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release（仅在所有平台构建成功后运行）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          gh release create "$VERSION" release-assets/* \
            --title "Algorithm Delivery $VERSION" \
            --generate-notes
