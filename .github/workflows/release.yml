          chmod +x "$RUNNER_TEMP/agv-package/agv"
          tar -C "$RUNNER_TEMP/agv-package" -czf             "$GITHUB_WORKSPACE/release-assets/agv-$ASSET.tar.gz" agv

      - name: 上传平台产物
        uses: actions/upload-artifact@v6
        with:
          name: release-agv-${{ matrix.asset }}
          path: release-assets/agv-${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 14

