name: agv-quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: AGV 质量门（native + WASM）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agv/rust
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js 24（WASM / Worker 冒烟）
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 Rust 1.88 与 wasm32 目标
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
          rustup default 1.88.0
          rustc --version && cargo --version

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            agv/rust/target
            aps/rust/target
            mapf/rust/target
          key: ${{ runner.os }}-cargo-agv-${{ hashFiles('agv/rust/Cargo.lock', 'aps/rust/Cargo.lock', 'mapf/rust/Cargo.lock') }}

      - name: 依赖与许可证（SBOM 最小审计：仅允许 aps-engine/mapf-engine 内部路径依赖）
        run: |
          cargo tree
          test "$(grep -c '^\[\[package\]\]' Cargo.lock)" = "3"
          cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; p=json.load(sys.stdin)["packages"][0]; deps=sorted(d["name"] for d in p["dependencies"]); assert deps==["aps-engine","mapf-engine"], deps; assert all(not d.get("registry") for d in p["dependencies"]), p["dependencies"]; print(p["name"], "deps=2(aps-engine,mapf-engine,path,third-party=0)")'

      - name: 格式检查（rustfmt）
        run: cargo fmt --all -- --check

      - name: 静态检查（clippy -D warnings）
        run: cargo clippy --all-targets -- -D warnings

      - name: 构建（release）
        run: cargo build --release --locked

      - name: 单元 + 集成测试
        run: cargo test --release --locked

      - name: A01–A16 引擎验收（机器可读报告）
        run: |
          ./target/release/agv acceptance --json target/acceptance-results.json
          python3 -c 'import json; d=json.load(open("target/acceptance-results.json")); s=d["summary"]; assert s["failed"]==0 and s["passed"]==s["total"], s; print("A01–A16:", s["passed"], "/", s["total"], "passed")'

      - name: 契约符合性检查（45 项：schema 防漂移 / mock / 引擎输出 / verify 报告 / 对抗样例）
        run: python3 scripts/check_contracts.py

      - name: 基准冒烟（B01–B03 · 硬门全过）
        run: |
          ./target/release/agv bench --json target/bench-results.json
          python3 -c 'import json; d=json.load(open("target/bench-results.json")); s=d["summary"]; assert s["failed"]==0, s; print("bench B01–B03:", s["passed"], "/", s["total"], "passed")'

      - name: WASM 构建 + ABI 冒烟
        run: bash scripts/build_wasm.sh

      - name: Worker 取消 / 终止 / 重建回归
        run: node scripts/test_worker_cancel.mjs

      - name: 上传引擎产物（供 Lab 与 Release 使用，保留 14 天）
        uses: actions/upload-artifact@v6
        with:
          name: agv-engine-artifacts
          path: |
            agv/rust/target/release/agv
            agv/rust/dist/agv_engine.wasm
            agv/rust/target/acceptance-results.json
          if-no-files-found: error
          retention-days: 14
