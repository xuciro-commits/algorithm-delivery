name: aps-rust

on:
  push:
    branches: ["**"]
    paths:
      - "aps/**"
      - ".github/workflows/aps-rust.yml"
      - ".github/workflows/aps-quality.yml"
  pull_request:
    paths:
      - "aps/**"
      - ".github/workflows/aps-rust.yml"
      - ".github/workflows/aps-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/aps-quality.yml
