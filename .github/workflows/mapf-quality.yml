name: mapf-quality

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: MAPF 质量门（native + WASM）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mapf/rust
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js（WASM / Worker 冒烟）
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 Rust 1.88 与 wasm32 目标
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.88.0
          rustup default 1.88.0
          rustc --version && cargo --version

      - name: 缓存 cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            mapf/rust/target
            aps/rust/target
          key: ${{ runner.os }}-cargo-mapf-${{ hashFiles('mapf/rust/Cargo.lock', 'aps/rust/Cargo.lock') }}

      - name: 依赖与许可证（SBOM 最小审计：仅允许 aps-engine 内部路径依赖）
        run: |
          cargo tree
          test "$(grep -c '^\[\[package\]\]' Cargo.lock)" = "2"
          cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; p=json.load(sys.stdin)["packages"][0]; deps=[d["name"] for d in p["dependencies"]]; assert deps==["aps-engine"], deps; assert all(not d.get("registry") for d in p["dependencies"]), p["dependencies"]; print(p["name"], "deps=1(aps-engine,path,third-party=0)")'

      - name: 格式检查（rustfmt）
        run: cargo fmt --all -- --check

      - name: 静态检查（clippy -D warnings）
        # 失败时把诊断（短格式）同时贴成一条错误注释：在 Actions 汇总页/PR 上直接看得见，
        # 不必先下载整份运行日志再翻。日志本体仍然完整保留在步骤输出里。
        run: |
          if cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee /tmp/clippy.log; then
            echo "clippy 通过（-D warnings）"
          else
            summary=$(python3 -c 'import sys;t=open("/tmp/clippy.log",errors="replace").read()[:20000];sys.stdout.write(t.replace("%","%25").replace(chr(13),"%0D").replace(chr(10),"%0A"))')
            echo "::error title=clippy::${summary}"
            exit 1
          fi

      - name: 构建（release）
        run: cargo build --release --locked

      - name: 单元 + 集成测试
        run: cargo test --release --locked

      - name: M01–M12 引擎验收（机器可读报告）
        run: |
          ./target/release/mapf acceptance --report target/ACCEPTANCE.md --json target/acceptance-results.json
          python3 -c 'import json; d=json.load(open("target/acceptance-results.json")); assert d["failed"]==0 and d["all_passed"], d; print("M01–M12:", d["passed"], "/", d["total"], "passed")'

      - name: 契约符合性检查
        run: python3 scripts/check_contracts.py

      - name: 基准快跑（empty-8-8 · 1s 预算 · 解出率与零核验失败硬门）
        run: |
          ./target/release/mapf bench --manifest ../bench/manifest.json --only empty-8-8 --budgets 1000 --objective soc --out target/bench-quick.json
          python3 - <<'PY'
          import json
          d = json.load(open("target/bench-quick.json"))
          rows = d["rows"]
          solved = sum(1 for r in rows if r["status"] in ("OPTIMAL", "FEASIBLE"))
          vfail = sum(1 for r in rows if r["status"] in ("OPTIMAL", "FEASIBLE") and not r.get("verified"))
          rate = solved / max(1, len(rows))
          print(f"bench quick: {solved}/{len(rows)} solved, rate={rate:.2f}, verification_failures={vfail}")
          assert vfail == 0
          assert rate >= 0.7, rate
          PY

      - name: WASM 构建 + ABI 冒烟
        run: bash scripts/build_wasm.sh

      - name: Worker 取消 / 终止 / 重建回归
        run: node scripts/test_worker_cancel.mjs

      - name: 上传引擎产物（供 Lab 与 Release 使用，保留 14 天）
        uses: actions/upload-artifact@v6
        with:
          name: mapf-engine-artifacts
          path: |
            mapf/rust/target/release/mapf
            mapf/rust/dist/mapf_engine.wasm
            mapf/rust/target/acceptance-results.json
          if-no-files-found: error
          retention-days: 14
