name: Lab visual acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  visual-acceptance:
    name: APS / MAPF / AGV · production WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v5

      - name: 预建证据目录并复制仓库内概念参考图
        run: |
          mkdir -p artifacts/visual/references
          cp design/concepts/aps-lab-concept.png artifacts/visual/references/
          cp design/concepts/mapf-lab-concept.png artifacts/visual/references/
          cp design/concepts/agv-lab-concept.png artifacts/visual/references/

      - name: 下载同一次 Lab production build（lab-preview）
        uses: actions/download-artifact@v8
        with:
          name: lab-preview
          path: lab/dist

      - name: 安装 Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: 安装锁定依赖（Playwright + 像素分析）
        run: npm ci --no-audit --no-fund

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('lab/package-lock.json') }}

      - name: 安装 Chromium 与 Ubuntu 系统依赖
        run: npx playwright install --with-deps chromium

      - name: APS / MAPF / AGV 浏览器视觉、真实求解与交互验收
        id: visual
        env:
          CI: "true"
          VISUAL_ARTIFACT_DIR: artifacts/visual
        # 作业日志归档在外部存储（API 只回注解、日志取不到），所以失败时把日志**首尾各 20 KB**
        # 打成 ::error:: 注解：Actions 汇总页 / PR / API 上直接能看到失败原因，
        # 不必下载 Artifact 或整份日志。首尾各取一段是因为"启动即失败"和"逐模块结果"分别在两端。
        run: |
          set +e
          npm run test:visual 2>&1 | tee "$RUNNER_TEMP/visual.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            head=$(python3 -c 'import sys;t=open(sys.argv[1],errors="replace").read()[:20000];sys.stdout.write(t.replace(chr(37),chr(37)+"25").replace(chr(13),chr(37)+"0D").replace(chr(10),chr(37)+"0A"))' "$RUNNER_TEMP/visual.log")
            echo "::error title=visual acceptance (head)::${head}"
            tail=$(python3 -c 'import sys;t=open(sys.argv[1],errors="replace").read()[-20000:];sys.stdout.write(t.replace(chr(37),chr(37)+"25").replace(chr(13),chr(37)+"0D").replace(chr(10),chr(37)+"0A"))' "$RUNNER_TEMP/visual.log")
            echo "::error title=visual acceptance (tail)::${tail}"
          fi
          exit "$status"

      - name: 上传截图、参考图、console 日志与验收报告（保留 30 天）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lab-visual-acceptance-${{ github.run_id }}
          path: lab/artifacts/visual
          if-no-files-found: warn
          retention-days: 30
