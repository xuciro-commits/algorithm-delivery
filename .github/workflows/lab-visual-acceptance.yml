name: Lab visual acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  visual-acceptance:
    name: APS / MAPF / AGV · production WebGL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4

      - name: 预建证据目录并复制仓库内概念参考图
        run: |
          mkdir -p artifacts/visual/references
          cp design/concepts/aps-lab-concept.png artifacts/visual/references/
          cp design/concepts/mapf-lab-concept.png artifacts/visual/references/
          cp design/concepts/agv-lab-concept.png artifacts/visual/references/

      - name: 下载同一次 Lab production build（lab-preview）
        uses: actions/download-artifact@v4
        with:
          name: lab-preview
          path: lab/dist

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: 安装锁定依赖（Playwright + 像素分析）
        run: npm ci --no-audit --no-fund

      - name: 安装 Chromium 与 Ubuntu 系统依赖
        run: npx playwright install --with-deps chromium

      - name: APS / MAPF / AGV 浏览器视觉、真实求解与交互验收
        env:
          CI: "true"
          VISUAL_ARTIFACT_DIR: artifacts/visual
        run: npm run test:visual

      - name: 上传截图、参考图、console 日志与验收报告（保留 30 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-visual-acceptance-${{ github.run_id }}
          path: lab/artifacts/visual
          if-no-files-found: warn
          retention-days: 30
